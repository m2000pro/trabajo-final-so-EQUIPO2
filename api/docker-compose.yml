services:
  db:
    image: postgres:16-alpine
    container_name: hardware-db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    mem_limit: 512m
    cpus: 0.75

    networks:
      - hardware-network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hardware-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

    security_opt:
      - no-new-privileges:true

    networks:
      - hardware-network

volumes:
  postgres_data:

networks:
  hardware-network:
    driver: bridge
